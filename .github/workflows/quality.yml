name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight GUI test dependencies
        run: python -m pip install "gradio==6.22.0"
      - name: Compile Python sources
        run: python -m py_compile trainer_gui.py train_lora.py prepare_dataset.py coreml/*.py
      - name: Run studio tests
        run: python -m unittest discover -s tests -v

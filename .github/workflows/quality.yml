name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight GUI test dependencies
        run: python -m pip install "PySide6-Essentials==6.11.1"
      - name: Compile Python sources
        run: python -m py_compile trainer_gui.py trainer_core.py train_lora.py prepare_dataset.py coreml/*.py
      - name: Smoke test native desktop window
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from trainer_gui import CloverTrainerWindow; app = QApplication([]); window = CloverTrainerWindow(); assert window.tabs.count() == 2"
      - name: Run studio tests
        run: python -m unittest discover -s tests -v
